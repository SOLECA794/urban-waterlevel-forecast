# 城市内涝（积水）水位预测预警系统 · 主配置（NFR-3 配置驱动一切）
app:
  name: 城市内涝（积水）水位预测预警系统
  host: 0.0.0.0
  port: 8000
  auto_forecast_on_startup: true   # 启动后立即执行一轮滚动预测（演示数据就绪）

datasource:
  type: simulated                  # simulated / real（real 需先实现 RealSourceAdapter）
  interval_minutes: 5              # 采样间隔（FR-1.2）
  history_hours: 72                # 模拟历史序列长度
  error_after_missing_cycles: 3    # 连续 3 个采样周期无数据置 ERROR（FR-1.3）
  stale_after_minutes: 30          # 评审 R2：样本滞后超过该分钟数 → 健康检查改判 STALE
  demo_key: FANGXUN-DEMO           # 评审 P1-7：模拟事件注入演示钥匙（生产用环境变量 WL_DEMO_KEY）

forecast:
  model_type: linear_response      # naive / linear_response（S7 可切换）
  lead_hours: [1, 3, 6, 12]        # 预见期；如需撤回 6h/12h 改为 [1, 3]（03 缺口补齐 §4.5）
  step_minutes: 5                  # 预测步长
  min_history_hours: 6             # 最小历史窗口（不足 → DATA_NOT_ENOUGH，FR-3.5）
  schedule_minutes: 5              # 滚动预测周期（FR-3.2）
  smoothing_alpha: 0.6
  linear_response:                 # 与模拟数据生成器共用同一套参数（ADR-3）
    gain: 0.006
    kernel_len: 12
    kernel_tau: 5.0
    response_k: 0.010              # 每步退水系数（stations.yaml 可按点位覆盖）
    decay: 0.08                    # NaiveModel 向基流回落速率（/h）
    ci_base: 0.02
    ci_sqrt_factor: 0.06

revision:                          # 多源协同修正（V1.3 §7.5）
  enabled: true
  alpha: 0.6                       # 修正强度（D3）
  rho: 0.85                        # 时间衰减 / 步
  beta: 0.02                       # 置信区间展宽系数 / min
  innovation_threshold: 0.05
  rain_gain: 0.004                 # 降雨新息(mm)→水位(m) 换算

alert:                             # 研判预警（FR-4）
  dedup_minutes: 30
  resolve_minutes: 15
  default_thresholds:              # 阈值口径：水位高程 m（07 §8 Q3 默认假设）
    blue: 1.8
    yellow: 2.2
    orange: 2.6
    red: 3.0

storage:
  data_dir: data
  sqlite_path: data/app.db         # 业务库（元数据/预测明细/预警/Agent 三表）
  parquet_dir: data/parquet        # 原始时序（分析查询由 DuckDB 直读）

agent:
  echo_enabled: true
  confirm_token: CONFIRMED         # L2 工具人工确认令牌（生产环境必须环境变量注入）
